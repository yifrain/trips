<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>旅行</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #1c1f23; background: #fff; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 32px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid #e4e6e9; }
  li:last-child { border-bottom: 1px solid #e4e6e9; }
  a { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 18px 0; color: inherit; text-decoration: none; }
  a:hover .name { text-decoration: underline; text-underline-offset: 4px; }
  a:focus-visible { outline: 2px solid #1d5a85; outline-offset: 2px; }
  .when { color: #8a919b; font-variant-numeric: tabular-nums; }
  .name { font-size: 18px; font-weight: 600; }
  .sub { color: #5f6772; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>旅行</h1>
  <ol>
    <!-- 新的旅行加在最上面 -->
    <li><a href="rome-naples/">
      <span class="when">2026.12</span>
      <span><span class="name">罗马与那不勒斯</span><br><span class="sub">12 月 12–17 日，6 天</span></span>
    </a></li>
  </ol>
</main>
</body>
</html>
